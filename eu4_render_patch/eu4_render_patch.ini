; EU4 Render Patch 0.6.0 (экспериментальный), EU4 1.37.5 x64.
; Ускоряет игру тем, что реже рисует кадры, пока игра быстро идёт.
; Игровая логика не меняется. Изменения действуют после перезапуска игры.
;
; Консоль игры: fps_render N - ограничить кадры до N в секунду, пока игра быстро идёт
; (1-240; 0 или off - без ограничения; без числа - показать текущее). Действует сразу и
; записывает frame_interval = 1/N в этот файл (running_frame_interval не меняет).
;
; mode:
;   throttle - включено: используются интервалы ниже
;   count    - ничего не меняет, только считает кадры (для замеров)
;   disabled - плагин ничего не трогает
[render]
mode=throttle

; tick_interval - кадры ВНУТРИ длинного тика (особенно месячного), в секундах.
; Игра рисует такой кадр не чаще, чем раз в tick_interval.
; Оригинал: 0.05 на скорости 5 и 0.02 на скоростях 1-4. Значение действует на все скорости,
; меньше оригинала не опускается. Допустимо больше 0 и до 10; иначе берётся 0.5.
; Больше = быстрее, но во время месячного тика картинка дольше стоит на месте.
tick_interval=0.5

; frame_interval - кадры ГЛАВНОГО ЦИКЛА, в секундах. 0 = выключено (как в оригинале).
; Кадр пропускается, только если игровые дни идут чаще этого интервала
; и с прошлого нарисованного кадра прошло меньше этого интервала.
; На паузе и на медленных скоростях кадры рисуются как обычно.
; 0.1 = примерно 10 кадров в секунду на быстрой игре. Допустимо от 0 до 2.
; Замер: 0.1 и 0.25 дали одинаково −8…−11% времени дня.
frame_interval=0.1

; skip_map_update - 1 = на пропущенных кадрах не обновлять и графику провинций на карте
; (здания, модели, юниты; ~6% главного потока). Время пропущенных кадров добавляется
; к следующему обновлению, чтобы анимации не отставали. Работает только при frame_interval > 0.
skip_map_update=1

; alert_interval - предупреждения на верхней панели (только при игре за страну), в секундах.
; Игра пересчитывает их на каждом проходе главного цикла (~2 мс, ~3.6% главного потока у России).
; 0 = как в оригинале. 0.5 = не чаще двух раз в секунду (замер за Россию: -5...-8%).
; Цена: значок предупреждения появляется/исчезает с задержкой до этого интервала. Допустимо от 0 до 10.
alert_interval=0.5

; map_icons_interval - значки над провинциями (меню строительства, торговля, осады, столица...),
; в секундах. Игра заново расставляет и заполняет их для каждой провинции на каждом кадре
; (с открытым меню строительства ~8% кадра). 0 = как в оригинале. 0.5 = не чаще двух раз в секунду.
; При движении камеры и при нажатой кнопке мыши значки обновляются сразу, поэтому они не
; отстают от карты и щелчки по ним работают как обычно. Цена: числа на значках (цена, прогресс
; осады) меняются с задержкой до этого интервала. Допустимо от 0 до 10.
; Замер (Россия, пауза, рынок в меню строительства): кадр 6.46 -> 6.25 мс (102 -> 106 FPS).
map_icons_interval=0.5

; map_icons_hide - полностью убрать значки над провинциями. Убирает и их обновление, и
; отрисовку текста на них (с меню строительства это ~33% кадра). Значения:
;   build - значки меню строительства (здания, войска, сословия, развитие, автономия...)
;   all   - все значки над провинциями (включая торговлю, осады, форты)
;   или список имён через запятую, например: building_improvements_mapicon,development_mapicon
; ВНИМАНИЕ: со значками исчезают и кнопки «+» на карте - строить придётся из окна провинции.
; Замер (как выше, build): кадр 6.46 -> 5.78 мс (102 -> 113 FPS).
;map_icons_hide=build
