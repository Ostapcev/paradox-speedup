; EU4 Pops Patch 0.1.0 (экспериментальный), EU4 1.37.5 x64.
; pops_api.dll (онлайн-сервисы Paradox: аккаунт, достижения, соц. функции) дважды за кадр
; опрашивает сеть в главном потоке с таймаутом 1 мс и, если делать нечего, спит Sleep(1).
; zero - таймаут 0: опрос идёт каждый кадр, но без сна. Логика игры не затрагивается.
; Изменения действуют после перезапуска игры.
[pops]
poll_sleep=off
