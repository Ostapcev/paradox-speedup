; EU4 Gov Patch 0.1.0 (экспериментальный), EU4 1.37.5 x64.
; Запоминает ответ проверки "есть ли у реформы правительства атрибут" (1407a6020).
; Ответ зависит только от данных реформы и набора DLC, поэтому логика игры не меняется.
; Изменения действуют после перезапуска игры.
;
; attr_cache:
;   off    - плагин ничего не трогает
;   shadow - игра считает как обычно, плагин сверяет с запомненным ответом (MISMATCH в логе)
;   on     - ответ берётся из памяти плагина
[gov]
attr_cache=off
