; Stellaris AI Skip Patch 0.1.0 — дневное обновление ИИ страны (140b75420 → 141b046f0) не каждый день (МЕНЯЕТ ПОВЕДЕНИЕ).
; Лог: stellaris_aiskip_patch.log (раз в минуту: обновления, пропуски, такты ИИ, стена фазы).
[aiskip]
; off — плагин не ставится; on — работает по rr/heavy (при rr=0 и heavy=0 — только замер, игра как есть)
mode=on
; rr=K — страна обновляет ИИ в дни, где (id + день) % K == 0; 0/1 — каждый день.
;   rr=2: пропуск 50 % обновлений, такты ИИ −43 %, дней/мин +7,5 %. rr=3: ещё +3,4 % к rr=2.
rr=3
; heavy=M — после обновления дороже M млн тактов страна пропускает следующий день (0 — выкл.).
;   heavy=50: пропуск ~9 % обновлений, такты ИИ −16 %, дней/мин +3,2 %.
heavy=0
