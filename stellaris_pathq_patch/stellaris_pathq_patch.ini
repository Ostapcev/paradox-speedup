; Stellaris PathQ Patch 0.4.0 — запрос пути между двумя системами для страны (140766810).
; Изменения действуют после перезапуска игры. Лог: stellaris_pathq_patch.log рядом с плагином.
[pathq]
; off   — ничего не меняет
; probe — только измеряет (число запросов, время, повторы и совпадение результатов) и пишет в лог
; shadow — кэш на игровой день только сравнивается с ответом игры; попадания и расхождения в лог
mode=off
; как часто писать сводку в лог, секунд
report_s=60
; предвыборка соседних систем в поиске пути (сколько гиперлиний снятой системы), 0 — выкл.
prefetch=0
; пары найденного пути — в кэш одним проходом под одной блокировкой: 1 — да, 0 — как в игре (перехват стоит), -1 — не ставить
; batch=2 — two passes: lookup under the shared lock, exclusive only for inserting missing pairs
; (removes reader spin at 1407668a8; live vs batch=1 at 14 workers: x1.014 days/s, within noise).
batch=2
