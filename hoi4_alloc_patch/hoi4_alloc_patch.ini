; HOI4 Alloc Patch 0.1.0 (экспериментальный), HOI4 1.19.4.2 x64. Порт eu4_alloc_patch 0.3.0.
; Заменяет malloc/free/calloc/realloc/_msize игры (статический CRT в hoi4.exe) на
; распределитель с кэшем по потокам для блоков до max_small байт. Большие блоки и чужие
; указатели идут в обычную кучу Windows. Логика игры не меняется.
; Изменения действуют после перезапуска игры.
;
; mode:
;   off - плагин ничего не трогает
;   on  - распределитель включён
[alloc]
mode=on

; max_small - блоки до этого размера (байт) раздаёт плагин, крупнее - куча Windows.
; 32768 по умолчанию, 2048 - как в EU4 0.2. Допустимо 256-32768.
max_small=32768

; direct - 1: new/delete игры сразу идут в распределитель (без 2-4 промежуточных переходов).
direct=1
