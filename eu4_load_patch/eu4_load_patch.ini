[load]
; Ported from Bellows (Happy Dwarf Team, MIT). off | shadow (compare every call) | on
blocks=on
subst=on
exists=on
token=on
verifypath=on
; history_add / transfer_skip: text saves (read and multiplayer/host transfer)
history=on
transfer=on
; range_witness: country range check (in game)
range=on
; ram_prefetch (shadow = verify every read) and open_warmup (cold start) with learned profiles
prefetch=on
warmup=on
prefetch_mb=1024
; Bellows ports (sim): port=off|shadow|on nearest-port table 0x350B80 from one port list;
; provview=off|shadow|on 0x2FFC60 without the modifier list copy;
; save=off|shadow|on ZIP member compression 0x153C790 with slice-by-8 CRC (only compressed saves);
; save_parallel=off|shadow|on big members in 1 MiB chunks on several threads (needs save)
port=off
provview=off
save=off
save_parallel=off
