; Stellaris Wait Patch 0.2.0 — ожидание главного потока при сохранении (сжатие на рабочем потоке).
; Изменения действуют после перезапуска игры. Лог: stellaris_wait_patch.log рядом с плагином.
[save]
; уровень сжатия сохранений zlib, 1..9 (в игре 5). 1 — быстрее всего, файл немного больше.
; 0 — не трогать
level=0
[wait]
; off   — ничего не меняет
; probe — пишет в лог, сколько главный поток ждал на каждом сохранении
mode=off
[spin]
; ожидание задач пула на главном потоке (1401597b0): off — как в игре (SwitchToThread),
; on — короткий спин pause, настоящий SwitchToThread только каждый every-й шаг
mode=off
every=64
