; Stellaris Ship Patch 0.1.0 — подкачка данных кораблей заранее (prefetch) в микротике.
; В микротике (10 раз в день) игра обходит все корабли и на каждом ждёт память: корабль -> флот ->
; владелец флота (зависимые промахи кэша). Плагин за несколько кораблей вперёд просит процессор
; подтянуть эти данные. Игра ничего не делает иначе: плагин только читает и подкачивает.
; Изменения действуют после перезапуска игры. Лог: stellaris_ship_patch.log рядом с плагином.
[ship]
; off — ничего не меняет; on — подкачка включена
mode=on
; на сколько кораблей вперёд каждая ступень (64 >= ship >= slot >= fleet >= owner >= 1)
ahead_ship=6
ahead_slot=4
ahead_fleet=2
ahead_owner=1
