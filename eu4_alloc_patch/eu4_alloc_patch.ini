; EU4 Alloc Patch 0.3.0 (экспериментальный), EU4 1.37.5 x64.
; Заменяет malloc/free/calloc/realloc/_msize игры (статический CRT в eu4.exe) на
; распределитель с кэшем по потокам для блоков до 2048 байт. Большие блоки и чужие
; указатели идут в обычную кучу Windows. Логика игры не меняется.
; Изменения действуют после перезапуска игры.
;
; mode:
;   off - плагин ничего не трогает
;   on  - распределитель включён
[alloc]
mode=off

; max_small - блоки до этого размера (байт) раздаёт плагин, крупнее - куча Windows.
; 32768 по умолчанию (0.3), 2048 - как в 0.2. Допустимо 256-32768.
max_small=32768

; direct - 1: new/delete игры сразу идут в распределитель (без 2-4 промежуточных переходов).
direct=1
