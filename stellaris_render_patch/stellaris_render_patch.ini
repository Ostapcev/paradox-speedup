; Stellaris Render Patch 0.2.0 — реже рисовать кадры, пока игра на большой скорости считает дни.
; Пока идёт расчёт дня, игра рисует полный кадр (интерфейс + карта) каждые 1/fps секунды,
; на большой галактике это до четверти времени главного потока. Игровую логику плагин не меняет.
; Изменения действуют после перезапуска игры. Лог: stellaris_render_patch.log рядом с плагином.
[render]
; off    — ничего не меняет
; shadow — ничего не меняет, только считает кадры изнутри тика и время на них (для замеров)
; on     — кадр изнутри тика рисуется не чаще, чем раз в frame_interval секунд
mode=on
; секунды между кадрами изнутри тика: 0.1 = не больше 10 кадров в секунду, пока идёт расчёт дня.
; 0 = как без плагина. Допустимо от 0 до 2.
frame_interval=0.1
; quiet_skip=1: при пропуске кадра сдвигать метку времени последнего кадра игры, иначе игра
; перепроверяет кадр сотни тысяч раз в секунду (на TEST5000: x1,27 вместо x1,21). 0 — не трогать метку.
quiet_skip=1
; как часто писать статистику в лог, секунд
report_s=30

; 0.2.0: кадры главного цикла, между игровыми тиками. Тик выполняется всегда; пропускается только
; кадр после него (ввод, интерфейс, карта, отрисовка) и только пока игра «бежит», то есть тяжёлые тики
; (расчёт дня) идут подряд. На паузе и на обычной скорости кадры не трогаются.
[main]
; off / shadow (только считать) / on
; off по умолчанию: на BENCH2300 (10 окон по минуте, живое переключение) on дал 1,66 против 1,75 дня/с.
; Кадр главного цикла рисуется, пока рабочие потоки доделывают шаг тика, то есть почти бесплатно;
; если его пропустить, следующий тик выходит пустым («лёгким») и кадр всё равно рисуется на нём.
mode=off
; общий потолок: кадр любого вида (изнутри тика или между тиками) не чаще раза в frame_interval секунд
frame_interval=0.1
; тик «тяжёлый» (шёл расчёт дня), если длился не меньше min_tick_ms
min_tick_ms=5
; игра «бежит», если min_streak тяжёлых тиков подряд шли с промежутками меньше run_gap_ms
min_streak=2
run_gap_ms=300
