; Stellaris Intel Patch 0.3.0 — быстрее расчёт видимости систем для страны (1406eecb0 / 1406ef480).
; Игра для каждой системы ищет её id линейным проходом по списку страны; плагин строит по этому
; списку таблицу один раз на расчёт и отвечает по ней — с тем же результатом.
; Изменения действуют после перезапуска игры. Лог: stellaris_intel_patch.log рядом с плагином.
[intel]
; off    — ничего не меняет
; shadow — ответ как в игре (проход), рядом таблица; расхождения (mismatch) пишутся в лог
; on     — ответ по таблице
mode=on
; как часто писать сводку в лог, секунд
report_s=60
; бинарный поиск 14071cbb0 (тот же расчёт): off / shadow / on — поиск от позиции прошлого ответа
bsearch=on
; rr=K — страна обновляет разведданные (вызов 1406eecb0 из дневной задачи 140301cc0) раз в K дней ((id + день) % K == 0).
; 0/1 — каждый день, как в игре. МЕНЯЕТ ПОВЕДЕНИЕ: видимость систем запаздывает до K-1 дней. K=3: дней/мин +4,4 %.
rr=3
