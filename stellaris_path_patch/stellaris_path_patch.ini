; Stellaris Path Patch 0.1.0 — быстрый пересчёт кэша расстояний между системами
; (в time.log игры: «Recalc cached data»). Результат побайтно как у игры.
; Изменения действуют после перезапуска игры. Лог: stellaris_path_patch.log рядом с плагином.
[path]
; off    — ничего не меняет
; shadow — игра считает сама, плагин после этого считает своим способом и сравнивает (проверка)
; on     — пересчёт делает плагин; при любом сомнении в предпосылках — как без плагина
mode=on
; потоки для пересчёта (0 — по числу логических процессоров)
threads=0
; сколько случайных пар сверять с точным A* игры перед записью (режим on); 0 — не сверять
verify_samples=256
