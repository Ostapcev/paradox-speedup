; EU4 Save Patch 0.1.0 (экспериментальный), EU4 1.37.5 x64.
; Параллельная запись стран и провинций при сохранении (игра на это время стоит).
; Каждый объект пишется рабочим потоком в свой буфер, затем буферы
; проигрываются в настоящий поток теми же вызовами, что делает игра.
; Изменения действуют после перезапуска игры.
;
; mode:
;   off    - плагин ничего не трогает
;   shadow - игра пишет как обычно, плагин сверяет параллельную запись с обычной (MISMATCH в логе)
;   on     - запись из буферов
; workers - число потоков (по умолчанию ядра - 2)
;
; pipe - контрольная сумма и запись файла сохранения идут фоновым потоком
;        следом за сборкой сохранения (только несжатые сохранения; нужен format не off):
;   off    - как в игре
;   verify - фон работает, но игра считает сумму сама; сверка суммы и файла (MISMATCH в логе)
;   on     - сумма и начало файла берутся у фонового потока
[save]
mode=off
pipe=off
