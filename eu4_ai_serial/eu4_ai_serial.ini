; EU4 AI Serial (experimental), EU4 1.37.5 x64.
; serial   - daily country AI runs on the main thread, without the parallel-for wait
; timing   - engine unchanged, only measures the daily AI parallel-for (submit + wait)
; disabled - no bytes changed
[ai]
mode=disabled
; sample_heavy=1 (only with mode=tasks) - stack-sample the heaviest AI task into eu4_ai_serial_heavy_stacks.csv
sample_heavy=0
; unit_flag_cache=off|shadow|on - cache 140d40ae0(unit,0xe0) per unit during the daily AI phase (needs mode timing/tasks/serial)
unit_flag_cache=off
; search_memo=off|shadow|on - Bellows army_search_memo: zone-of-control flag + army speed once per
;   army search / path search / unit moves listing (takes the unit_flag_cache call site and forwards to it)
search_memo=off
; country_ratio_cache=off|shadow|on - cache 1403747b0(country) per country during the daily AI phase (needs mode timing/tasks/serial)
country_ratio_cache=off
; province_score_cache=off|shadow|on - cache 1401998f0 (army AI province score) per exact arguments during the daily AI phase
province_score_cache=off
