; HOI4 Supply Patch 0.3.0, HOI4 1.19.4.2 x64. Изменения действуют после перезапуска игры.
; Кэш поиска путей снабжения (Dijkstra) по странам: если все входы страны с прошлого часа
; не изменились, расчёт не повторяется, а его результат восстанавливается из снимка.
; Результат побайтно тот же, что у игры (проверено в режиме verify: ~477 тыс. восстановлений, 0 расхождений).
; mode:
;   off    - ничего не трогает;
;   on     - кэш включён;
;   verify - проверка: при попадании считает и восстановление, и настоящий расчёт и сравнивает
;            их (медленнее ванили, только для проверки);
;   shadow - сравнение хешей входов/выходов, без восстановления (для разбора);
;   timing - только замеры времени снабжения.
; Лог: hoi4_supply_patch.log рядом с плагином.
[supply]
mode=on
