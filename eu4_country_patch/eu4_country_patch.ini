; EU4 Country Patch 0.2.0 (экспериментальный), EU4 1.37.5 x64.
; Перед дневным циклом стран параллельно считает условия появления сословий
; (140723120) для всех стран; в цикле ответ берётся из этой таблицы.
; Изменения действуют после перезапуска игры.
;
; estates:
;   off    - плагин ничего не трогает
;   shadow - игра считает как обычно, плагин сверяет с заранее посчитанным (MISMATCH в логе)
;   on     - ответ из таблицы (только после долгой проверки shadow без расхождений)
; strength - то же для силы армии/флота страны (14093c790/14093ca70), off|shadow|on
; workers - число дополнительных потоков (по умолчанию ядра - 4)
[country]
estates=off
strength=off
; relpf - подгрузка в кэш записей отношений для месячного обновления отношений (1402f9c50).
; Логика игры не меняется (только чтение). on / off. Замер: месячный тик -4 мс (~-1.5%).
relpf=off
; pmpf - подгрузка в кэш старого кэша модификаторов провинций перед месячным пересчётом.
; Только чтение, логика игры не меняется. on / off. Замер: месячный тик ~-1%.
pmpf=off
; merc - доступность рот наёмников заранее для всех стран (off | shadow | on).
;   Ответ считается до того, как страны раньше по очереди обработаны: shadow сверяет с игрой.
merc=off
; hist - обходы истории провинций заранее для всех стран (off | shadow | on). Как merc: shadow сверяет с игрой.
hist=off

; relguard - защита от вылета игры при удалении дипломатических отношений: в редком случае
;   игра (relation.cpp, 140a61900) вызывает удаление отношения с пустым указателем и падает.
;   on = такой вызов пропускается (в лог пишется строка relguard), off = как в игре.
;   Найдено 2026-11-09 в Анбеннаре (1490 год, вместе с eu4_alloc_patch); с защитой не падает.
; Долгая проверка Анбеннара 2026-11-09 (shadow, 1444-1493): редкие расхождения у strength
;   (41 на 26 млн), merc (17 на 203 млн), estates (7 на 434 млн), reforms (2 на 64 млн).
;   Если нужна точность как у обычной игры - поставьте этим строкам off.
relguard=on
