; HOI4 Bench Helper 0.1.0 — вспомогательный плагин для бенчмарка, HOI4 1.19.4.2 x64.
; Игровую логику не меняет. Изменения действуют после перезапуска игры.
[bench]
; observe=on - после загрузки сохранения сам выполняет консольную команду observe
; (режим наблюдателя). off - плагин ничего не трогает.
observe=on

; Через сколько ИГРОВЫХ часов после загрузки переходить в наблюдатель.
observe_after_hours=24
