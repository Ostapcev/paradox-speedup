; Stellaris Scan Patch 0.1.0 — подкачка памяти в поиске флота 140874c70 (~600 тыс. вызовов/с на 2300 году).
; Логику игры не меняет: только prefetch того, что функция и так прочитает. Изменения — после перезапуска.
[scan]
; prefetch=1 — подкачка включена (BENCH2300: 0,18 против 0,22 мкс на вызов, -18 %); 0 — выключена
prefetch=1
; mode=probe — замер вызовов и времени в лог (сам добавляет ~30 нс на вызов); off — без замера
mode=off
report_s=30
