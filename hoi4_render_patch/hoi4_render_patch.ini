; HOI4 Render Patch 0.3.0 (экспериментальный), HOI4 1.19.4.2 x64.
; Ускоряет игру тем, что реже рисует кадры и графику карты, пока игра быстро идёт.
; Изменения действуют после перезапуска игры.
;
; mode:
;   throttle - включено: пропуск кадров по frame_interval
;   count    - ничего не меняет, только считает кадры (для замеров)
;   disabled - плагин ничего не трогает
[render]
mode=throttle

; frame_interval - кадры ГЛАВНОГО ЦИКЛА, в секундах. 0 = выключено (как в оригинале).
; Кадр пропускается, только если игровые часы идут чаще этого интервала
; и с прошлого нарисованного кадра прошло меньше этого интервала.
; На паузе, в меню и на медленных скоростях кадры рисуются как обычно.
; 0.1 = примерно 10 кадров в секунду на быстрой игре. Допустимо от 0 до 2.
; ВНИМАНИЕ: индикаторы автосохранения/скриншота на пропущенных кадрах
; показываются на следующем нарисованном кадре (задержка до frame_interval).
frame_interval=0.1

; provinces_interval - обновление графики провинций карты (Update Provinces,
; ~10% главного потока в 1940-м), в секундах. 0 = как в оригинале.
; Срабатывает только когда игра бежит быстро; на паузе обновляется каждый кадр.
; 0.25 = не чаще четырёх раз в секунду. Допустимо от 0 до 10.
provinces_interval=0.25

; unitgfx_interval - обновление юнит-графики карты (модельки/счётчики юнитов,
; ~4,5% главного потока), в секундах. 0 = как в оригинале. 0.1 = не чаще десяти
; раз в секунду. Допустимо от 0 до 10.
unitgfx_interval=0.1

; supply_interval - почасовой пересчёт СНАБЖЕНИЯ (CSupplySystem, до ~21%
; часового тика в поздней игре), в ИГРОВЫХ ЧАСАХ. 1 = каждый час, как в
; оригинале (выключено). 2 = через час, 4 = раз в четыре часа и т.д.
; ВНИМАНИЕ: это игровая логика — снабжение дивизий будет обновляться реже,
; что влияет на геймплей. Допустимо от 1 до 168.
supply_interval=1

; scene_interval - обновление 3D-сцены движка не чаще, чем раз в N секунд, пока часы идут быстро
;   (пропущенное время копится, анимации идут с той же скоростью). 0 = как в оригинале.
scene_interval=0.1

; ai_frames - 1 = рисовать кадр, пока главный поток ждёт ежечасный ИИ (отрисовка идёт
;   одновременно с ИИ, а не после тика). Использует встроенный в игру механизм вложенного кадра
;   (debug_smooth). Только графика. 0 = как в оригинале.
ai_frames=0

; ai_wait - 1 = в цикле ожидания ежечасного ИИ главный поток делает короткие паузы (pause)
;   вместо постоянного SwitchToThread, меньше мешая соседнему логическому ядру. 0 = как в оригинале.
ai_wait=1

; tick_interval - кадры ВНУТРИ тика (механизм игры debug_smooth), не чаще раза в N секунд.
;   0 = как в оригинале. 0.5 = во время длинного тика картинка обновляется 2 раза в секунду.
tick_interval=0.25
