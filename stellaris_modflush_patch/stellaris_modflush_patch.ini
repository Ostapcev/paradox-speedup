; Stellaris Modflush Patch 0.2.0 — отложенный пересчёт графа модификаторов (МЕНЯЕТ ПОВЕДЕНИЕ). Лог: stellaris_modflush_patch.log.
[modflush]
; off — игра; on — откладывать места из mask; shadow — игра + счётчики
mode=on
; маска мест (бит k = место k): 0 — 14024c03a шаг тика, 6 — 1403afb1f эффекты событий, 7 — 1416e65b8,
; 8 — 1416e6e74, 9 — 1416e823a (эффекты). 961 = 0x3c1: граф пересчитывается в DailyUpdate (2 раза в день),
; на месячном и по set_update_modifiers_batch.
mask=961
