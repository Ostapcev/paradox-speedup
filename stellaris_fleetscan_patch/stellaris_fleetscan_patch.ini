; Stellaris Fleetscan Patch 0.3.0 — дневная задача «известные флоты» страны 140714e50. Лог: stellaris_fleetscan_patch.log.
[fleetscan]
; mode: off — без замера/предвыборки (prefetch давал 1–2 %, выключен); shadow/on — замер
mode=off
; cache: кэш триггера цикла 1 (точный, 0 расхождений на 200 млн проверок)
cache=on
; rr=K — страна обновляет известные флоты раз в K дней ((id + день) % K == 0); 0/1 — каждый день, как в игре.
; МЕНЯЕТ ПОВЕДЕНИЕ: сведения о чужих флотах запаздывают до K-1 дней. K=3: стена задачи −65 %, дней/мин +2 %.
rr=3
