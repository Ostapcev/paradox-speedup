; Stellaris Fleet Patch 0.2.0 — не сбрасывать заново уже пустое состояние движения флота.
; В каждом микротике (10 раз в день) игра для каждого флота заполняет 0x100 байт значениями по
; умолчанию, даже если там уже они. Плагин пропускает такой сброс; результат тот же байт в байт.
; Изменения действуют после перезапуска игры. Лог: stellaris_fleet_patch.log рядом с плагином.
[fleet]
; off    — ничего не меняет
; shadow — сброс как в игре + проверка, что пропуск ничего бы не изменил (mismatch в логе = 0)
; on     — пропускать сброс уже пустого состояния
mode=on
; как часто писать сводку в лог, секунд
report_s=60
; подкачка (prefetch) данных флотов в том же цикле: off — нет, on — да (не зависит от mode)
prefetch=on
; на сколько записей вперёд: строка записи / строки записи и флота (64 >= entry >= fleet >= 1)
prefetch_entry=8
prefetch_fleet=4
