[knowledge]
; parallel_shadow: parallel read-only phase, original apply phase, full comparison.
; parallel: parallel read-only phase, sequential apply with per-pair fallback.
; optimized: use validated inverse core/claim lists instead of scanning provinces.
; shadow: original game behavior plus independent equivalence measurements.
; disabled: no hooks and no game-memory changes.
mode=parallel

[scheduler]
; efficient: pause/yield only after all task indices are drained.
; disabled: preserve the original scheduler wait loop.
wait=efficient
