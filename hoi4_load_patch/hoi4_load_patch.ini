; HOI4 Load Patch 0.1.0 — ускорение запуска игры без изменения её поведения.
; Изменения действуют после перезапуска игры. Лог: hoi4_load_patch.log рядом с плагином.
[load]
tags=on
phases=off
; registry - реестр всех триггеров (CTrigger): удаление из него без полного перебора
;   (реестр доходит до 1.4 млн записей). off | timing (замер) | shadow (проверка) | on
registry=on
; files - индекс файлов папки игры: на поиск несуществующего файла в папках DLC сразу
;   отвечает той же ошибкой, что Windows (игра делает ~1.1 млн таких промахов при запуске).
;   Если игра что-то создаёт в папке игры, индекс выключается до конца сессии.
;   off | timing (замер) | shadow (Windows спрашивается всегда, ответ сравнивается) | on
files=on
