; Stellaris AI Patch 0.2.0
[ai]
; probe = timing of the parallel AI phase (logs every report_s seconds); off = no probe
mode=off
report_s=30

[threads]
; worker threads per task-pool group (the game itself uses max(logical/2, cores) - 1 = 7 on 8 cores / 16 threads).
; -1 = auto (logical processors - 2), 0 = leave as the game set it. Live: sai_group1/sai_group0.
; BENCH2300 on 7940H: 7 -> 14 gave +5% days/s.
group1=-1
group0=-1
