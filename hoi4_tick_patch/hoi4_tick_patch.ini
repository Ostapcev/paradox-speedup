; HOI4 Tick Patch 0.1.0 - ускорение часового/дневного тика без изменения логики игры.
; Изменения действуют после перезапуска игры. Лог: hoi4_tick_patch.log рядом с плагином.
[tick]
; pfor - мелкие параллельные циклы игры (parallel-for) выполнять сразу в вызывающем потоке
;   (штатный путь игры для одного задания) вместо раздачи рабочим потокам и ожидания.
;   off | probe (только замер: по каждому месту вызова время параллельно и последовательно) | on
pfor=off
; места вызова (адреса возврата из 142573440), которые в режиме on идут последовательно
serial_sites=
; mods - поиск значения модификатора 1405a5210: off | measure | shadow | on
mods=off
mods_linear_limit=0
; aiprof - 1 = замер времени ежечасного ИИ по странам (только измерение, лог раз в 30 с)
aiprof=0
