; Stellaris Budget Patch 0.1.0 — проверка «истёк ли бюджет кадра» (140938370) читает системный таймер
; около миллиона раз в секунду. Плагин делает настоящую проверку на каждом every-м вызове; на состояние
; игры это не влияет — только момент отрисовки кадра из тика. Лог: stellaris_budget_patch.log.
[budget]
mode=on
; степень двойки: 1 — как в игре, 16 — каждый 16-й вызов
every=16
